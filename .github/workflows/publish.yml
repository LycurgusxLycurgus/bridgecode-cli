name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Match tag to package version
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag/version mismatch');"
      - run: npm run build:manifest
      - run: npm test
      - run: npm run test:release -- --output release
      - name: Publish the tested artifact
        run: npm publish "./release/bridgecode-cli-$(node -p 'require("./package.json").version').tgz" --access public --provenance
